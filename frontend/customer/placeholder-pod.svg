      <stop offset="0" stop-color="#1e2240"/>
      <stop offset="1" stop-color="#0f1225"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a4f"/>
